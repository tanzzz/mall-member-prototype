<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>停车缴费</title>
    <style>
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes countPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; background:#1a1a2e; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        /* iPhone 17 Pro 外壳 */
        .iphone-device { width:403px; height:874px; background:linear-gradient(145deg,#2a2a2a,#1a1a1a,#0d0d0d); border-radius:52px; padding:14px; position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5),0 0 120px rgba(0,0,0,.3),inset 0 0 1px rgba(255,255,255,.1); }
        .iphone-device::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:130px; height:34px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
        .iphone-device::after { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:100px; height:28px; background:#000; border-radius:0 0 16px 16px; z-index:101; }
        .dynamic-island-cam { position:absolute; top:18px; right:calc(50% - 42px); width:10px; height:10px; background:radial-gradient(circle at 35% 35%,#1a1a2e,#000); border-radius:50%; z-index:102; border:1px solid rgba(255,255,255,.05); }
        .btn-side-left-1 { position:absolute; left:-2px; top:140px; width:3px; height:28px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-2 { position:absolute; left:-2px; top:195px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-3 { position:absolute; left:-2px; top:253px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-right { position:absolute; right:-2px; top:200px; width:3px; height:60px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:0 2px 2px 0; }
        .iphone-screen { width:375px; height:812px; border-radius:40px; overflow:hidden; position:relative; background:#F5F5F5; }
        .home-indicator { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,.2); border-radius:3px; z-index:200; }
        .phone-frame { width:375px; height:812px; background:#F5F5F5; position:relative; overflow:hidden; display:flex; flex-direction:column; }
        .status-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:12px; color:#fff; }
        .status-bar .time { font-weight:600; }
        .status-bar .icons { display:flex; gap:4px; font-size:11px; }
        .nav-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
        .nav-bar .back { font-size:20px; color:#fff; cursor:pointer; }
        .nav-bar .title { font-size:17px; font-weight:600; color:#fff; }
        .nav-bar .record { font-size:13px; color:rgba(255,255,255,.8); cursor:pointer; }
        .scroll-content { flex:1; overflow-y:auto; padding:12px; }
        .scroll-content::-webkit-scrollbar { display:none; }
        .car-card { background:linear-gradient(135deg,#1E88E5,#42A5F5); border-radius:10px; padding:16px; color:#fff; position:relative; overflow:hidden; animation:fadeInUp .5s ease; }
        .car-card::before { content:''; position:absolute; top:-20px; right:-20px; width:80px; height:80px; background:radial-gradient(circle,rgba(255,255,255,.1),transparent); border-radius:50%; }
        .car-card .car-info { display:flex; align-items:center; gap:10px; }
        .car-card .car-icon { font-size:28px; }
        .car-card .plate { font-size:20px; font-weight:700; letter-spacing:1px; }
        .car-card .car-desc { font-size:11px; color:rgba(255,255,255,.7); margin-top:4px; }
        .fee-card { background:#fff; border-radius:10px; padding:20px; margin-top:12px; text-align:center; animation:fadeInUp .5s ease .1s both; }
        .fee-card .fee-label { font-size:13px; color:#999; }
        .fee-card .fee-amount { font-size:42px; font-weight:700; color:#E2231A; margin:8px 0; animation:countPulse 1.5s infinite; }
        .fee-card .fee-amount .yen { font-size:18px; }
        .fee-card .fee-detail { display:flex; justify-content:space-around; margin-top:12px; padding-top:12px; border-top:.5px solid #F0F0F0; }
        .fee-card .fee-detail .item { text-align:center; }
        .fee-card .fee-detail .item .val { font-size:16px; font-weight:600; color:#333; }
        .fee-card .fee-detail .item .label { font-size:11px; color:#999; margin-top:2px; }
        .discount-card { background:#FFF8E1; border-radius:10px; padding:12px 16px; margin-top:12px; display:flex; align-items:center; gap:10px; animation:fadeInUp .5s ease .2s both; }
        .discount-card .icon { font-size:24px; }
        .discount-card .info { flex:1; }
        .discount-card .info .title { font-size:13px; font-weight:600; color:#E65100; }
        .discount-card .info .desc { font-size:11px; color:#999; margin-top:2px; }
        .discount-card .tag { background:#E2231A; color:#fff; font-size:10px; padding:2px 8px; border-radius:8px; }
        .pay-btn { width:100%; height:48px; background:linear-gradient(135deg,#E2231A,#FF4D3A); border:none; border-radius:10px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:16px; transition:transform .2s; box-shadow:0 4px 16px rgba(226,35,26,.3); animation:fadeInUp .5s ease .3s both; }
        .pay-btn:active { transform:scale(.97); }
        .history-section { margin-top:20px; animation:fadeInUp .5s ease .4s both; }
        .history-section .section-title { font-size:14px; font-weight:600; color:#333; margin-bottom:8px; }
        .history-item { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
        .history-item .left { display:flex; align-items:center; gap:10px; }
        .history-item .left .icon { font-size:20px; }
        .history-item .left .info .plate { font-size:14px; font-weight:500; color:#333; }
        .history-item .left .info .date { font-size:11px; color:#999; margin-top:2px; }
        .history-item .right { text-align:right; }
        .history-item .right .amount { font-size:15px; font-weight:600; color:#333; }
        .history-item .right .status { font-size:10px; color:#43A047; margin-top:2px; }
    </style>
</head>
<body>
    <div class="iphone-device">
        <div class="dynamic-island-cam"></div>
        <div class="btn-side-left-1"></div>
        <div class="btn-side-left-2"></div>
        <div class="btn-side-left-3"></div>
        <div class="btn-side-right"></div>
        <div class="iphone-screen">
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">09:41</span>
            <span class="icons">5G 100% ▮</span>
        </div>
        <div class="nav-bar">
            <span class="back" onclick="history.back()">‹</span>
            <span class="title">停车缴费</span>
            <span class="record" onclick="alert('缴费记录')">记录</span>
        </div>
        <div class="scroll-content">
            <div class="car-card">
                <div class="car-info">
                    <span class="car-icon">🚗</span>
                    <div>
                        <div class="plate">粤B·A8888</div>
                        <div class="car-desc">B2层 · A区 · 088号车位</div>
                    </div>
                </div>
            </div>
            <div class="fee-card">
                <div class="fee-label">当前停车费用</div>
                <div class="fee-amount"><span class="yen">¥</span>24.00</div>
                <div class="fee-detail">
                    <div class="item"><div class="val">3小时12分</div><div class="label">停车时长</div></div>
                    <div class="item"><div class="val">¥8.00/时</div><div class="label">标准费率</div></div>
                    <div class="item"><div class="val">8折</div><div class="label">会员折扣</div></div>
                </div>
            </div>
            <div class="discount-card">
                <span class="icon">🎫</span>
                <div class="info">
                    <div class="title">会员专享8折优惠</div>
                    <div class="desc">黄金会员自动享受停车8折</div>
                </div>
                <span class="tag">已生效</span>
            </div>
            <button class="pay-btn" onclick="alert('确认支付¥24.00？')">立即缴费 ¥24.00</button>
            <div class="history-section">
                <div class="section-title">缴费记录</div>
                <div class="history-item">
                    <div class="left"><span class="icon">🅿️</span><div class="info"><div class="plate">粤B·A8888</div><div class="date">2026.08.05 14:30</div></div></div>
                    <div class="right"><div class="amount">¥16.00</div><div class="status">已支付</div></div>
                </div>
                <div class="history-item">
                    <div class="left"><span class="icon">🅿️</span><div class="info"><div class="plate">粤B·A8888</div><div class="date">2026.08.02 09:15</div></div></div>
                    <div class="right"><div class="amount">¥32.00</div><div class="status">已支付</div></div>
                </div>
            </div>
        </div>
    </div>
        </div>
        <div class="home-indicator"></div>
        </div>
</body>
</html>
