<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>门店导览</title>
    <style>
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; background:#1a1a2e; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        /* iPhone 17 Pro 外壳 */
        .iphone-device { width:403px; height:874px; background:linear-gradient(145deg,#2a2a2a,#1a1a1a,#0d0d0d); border-radius:52px; padding:14px; position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5),0 0 120px rgba(0,0,0,.3),inset 0 0 1px rgba(255,255,255,.1); }
        .iphone-device::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:130px; height:34px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
        .iphone-device::after { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:100px; height:28px; background:#000; border-radius:0 0 16px 16px; z-index:101; }
        .dynamic-island-cam { position:absolute; top:18px; right:calc(50% - 42px); width:10px; height:10px; background:radial-gradient(circle at 35% 35%,#1a1a2e,#000); border-radius:50%; z-index:102; border:1px solid rgba(255,255,255,.05); }
        .btn-side-left-1 { position:absolute; left:-2px; top:140px; width:3px; height:28px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-2 { position:absolute; left:-2px; top:195px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-3 { position:absolute; left:-2px; top:253px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-right { position:absolute; right:-2px; top:200px; width:3px; height:60px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:0 2px 2px 0; }
        .iphone-screen { width:375px; height:812px; border-radius:40px; overflow:hidden; position:relative; background:#F5F5F5; }
        .home-indicator { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,.2); border-radius:3px; z-index:200; }
        .phone-frame { width:375px; height:812px; background:#F5F5F5; position:relative; overflow:hidden; display:flex; flex-direction:column; }
        .status-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:12px; color:#fff; }
        .status-bar .time { font-weight:600; }
        .status-bar .icons { display:flex; gap:4px; font-size:11px; }
        .nav-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:center; position:relative; }
        .nav-bar .back { position:absolute; left:16px; font-size:20px; color:#fff; cursor:pointer; }
        .nav-bar .title { font-size:17px; font-weight:600; color:#fff; }
        .nav-bar .search { position:absolute; right:16px; font-size:13px; color:rgba(255,255,255,.8); cursor:pointer; }
        .floor-tabs { display:flex; background:#fff; padding:0; border-bottom:.5px solid #F0F0F0; overflow-x:auto; }
        .floor-tabs::-webkit-scrollbar { display:none; }
        .floor-tabs .floor-tab { flex-shrink:0; padding:12px 16px; font-size:13px; color:#666; cursor:pointer; position:relative; white-space:nowrap; transition:color .2s; }
        .floor-tabs .floor-tab.active { color:#E2231A; font-weight:600; }
        .floor-tabs .floor-tab.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:20px; height:2px; background:#E2231A; border-radius:1px; }
        .scroll-content { flex:1; overflow-y:auto; padding:12px; }
        .scroll-content::-webkit-scrollbar { display:none; }
        .floor-info { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; animation:fadeInUp .5s ease; }
        .floor-info .floor-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
        .floor-info .floor-header .floor-badge { background:linear-gradient(135deg,#E2231A,#FF4D3A); color:#fff; padding:3px 10px; border-radius:8px; font-size:12px; font-weight:600; }
        .floor-info .floor-header .floor-name { font-size:15px; font-weight:600; color:#333; }
        .floor-info .floor-header .floor-count { font-size:11px; color:#999; margin-left:auto; }
        .store-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:.5px solid #F5F5F5; animation:slideIn .4s ease; }
        .store-item:last-child { border-bottom:none; }
        .store-item .store-logo { width:48px; height:48px; background:#F5F5F5; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
        .store-item .store-info { flex:1; min-width:0; }
        .store-item .store-info .store-name { font-size:14px; font-weight:500; color:#333; }
        .store-item .store-info .store-cat { font-size:11px; color:#999; margin-top:2px; }
        .store-item .store-info .store-tags { display:flex; gap:4px; margin-top:4px; }
        .store-item .store-info .store-tags .tag { font-size:9px; padding:1px 5px; border-radius:3px; }
        .store-item .store-info .store-tags .tag.hot { background:#FFEBEE; color:#E2231A; }
        .store-item .store-info .store-tags .tag.new { background:#E3F2FD; color:#1E88E5; }
        .store-item .store-info .store-tags .tag.sale { background:#FFF3E0; color:#E65100; }
        .store-item .store-action { display:flex; flex-direction:column; align-items:center; gap:2px; }
        .store-item .store-action .nav-btn { width:32px; height:32px; background:linear-gradient(135deg,#E2231A,#FF4D3A); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; cursor:pointer; }
        .store-item .store-action .nav-label { font-size:9px; color:#999; }
        .map-card { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; animation:fadeInUp .5s ease .2s both; }
        .map-card .map-title { font-size:14px; font-weight:600; color:#333; margin-bottom:10px; }
        .map-card .map-placeholder { width:100%; height:160px; background:linear-gradient(135deg,#E8EAF6,#C5CAE9); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#5C6BC0; position:relative; overflow:hidden; }
        .map-card .map-placeholder .map-icon { font-size:32px; margin-bottom:6px; }
        .map-card .map-placeholder .map-text { font-size:12px; }
        .map-card .map-placeholder .map-grid { position:absolute; top:0; left:0; width:100%; height:100%; background-image:repeating-linear-gradient(0deg,rgba(92,107,192,.1) 0,rgba(92,107,192,.1) 1px,transparent 1px,transparent 20px),repeating-linear-gradient(90deg,rgba(92,107,192,.1) 0,rgba(92,107,192,.1) 1px,transparent 1px,transparent 20px); }
        .service-bar { background:#fff; border-radius:10px; padding:14px; animation:fadeInUp .5s ease .3s both; }
        .service-bar .service-title { font-size:14px; font-weight:600; color:#333; margin-bottom:10px; }
        .service-bar .service-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
        .service-bar .service-grid .service-item { text-align:center; cursor:pointer; }
        .service-bar .service-grid .service-item .service-icon { width:40px; height:40px; background:#F5F5F5; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; margin:0 auto 4px; }
        .service-bar .service-grid .service-item .service-name { font-size:10px; color:#666; }
    </style>
</head>
<body>
    <div class="iphone-device">
        <div class="dynamic-island-cam"></div>
        <div class="btn-side-left-1"></div>
        <div class="btn-side-left-2"></div>
        <div class="btn-side-left-3"></div>
        <div class="btn-side-right"></div>
        <div class="iphone-screen">
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">09:41</span>
            <span class="icons">5G 100% ▮</span>
        </div>
        <div class="nav-bar">
            <span class="back" onclick="history.back()">‹</span>
            <span class="title">门店导览</span>
            <span class="search" onclick="alert('搜索门店')">🔍</span>
        </div>
        <div class="floor-tabs" id="floorTabs">
            <div class="floor-tab active" onclick="switchFloor(this,'B1')">B1层</div>
            <div class="floor-tab" onclick="switchFloor(this,'F1')">1F层</div>
            <div class="floor-tab" onclick="switchFloor(this,'F2')">2F层</div>
            <div class="floor-tab" onclick="switchFloor(this,'F3')">3F层</div>
            <div class="floor-tab" onclick="switchFloor(this,'F4')">4F层</div>
            <div class="floor-tab" onclick="switchFloor(this,'F5')">5F层</div>
        </div>
        <div class="scroll-content">
            <div class="floor-info">
                <div class="floor-header">
                    <span class="floor-badge">B1</span>
                    <span class="floor-name">精品生活</span>
                    <span class="floor-count">8家店铺</span>
                </div>
                <div class="store-item">
                    <div class="store-logo">🥗</div>
                    <div class="store-info">
                        <div class="store-name">Ole' 精品超市</div>
                        <div class="store-cat">B1-A01 · 生鲜食品</div>
                        <div class="store-tags"><span class="tag hot">热门</span></div>
                    </div>
                    <div class="store-action"><div class="nav-btn" onclick="alert('导航到Ole\'精品超市')">📍</div><span class="nav-label">导航</span></div>
                </div>
                <div class="store-item">
                    <div class="store-logo">💊</div>
                    <div class="store-info">
                        <div class="store-name">屈臣氏</div>
                        <div class="store-cat">B1-A02 · 个护美妆</div>
                        <div class="store-tags"><span class="tag sale">促销</span></div>
                    </div>
                    <div class="store-action"><div class="nav-btn" onclick="alert('导航到屈臣氏')">📍</div><span class="nav-label">导航</span></div>
                </div>
                <div class="store-item">
                    <div class="store-logo">🧋</div>
                    <div class="store-info">
                        <div class="store-name">喜茶</div>
                        <div class="store-cat">B1-B03 · 茶饮甜品</div>
                        <div class="store-tags"><span class="tag hot">热门</span><span class="tag new">新品</span></div>
                    </div>
                    <div class="store-action"><div class="nav-btn" onclick="alert('导航到喜茶')">📍</div><span class="nav-label">导航</span></div>
                </div>
                <div class="store-item">
                    <div class="store-logo">🍞</div>
                    <div class="store-info">
                        <div class="store-name">原麦山丘</div>
                        <div class="store-cat">B1-B05 · 烘焙面包</div>
                        <div class="store-tags"></div>
                    </div>
                    <div class="store-action"><div class="nav-btn" onclick="alert('导航到原麦山丘')">📍</div><span class="nav-label">导航</span></div>
                </div>
            </div>
            <div class="map-card">
                <div class="map-title">楼层导览图</div>
                <div class="map-placeholder">
                    <div class="map-grid"></div>
                    <span class="map-icon">🗺️</span>
                    <span class="map-text">B1层平面导览图</span>
                </div>
            </div>
            <div class="service-bar">
                <div class="service-title">便民服务</div>
                <div class="service-grid">
                    <div class="service-item" onclick="alert('卫生间位置')"><div class="service-icon">🚻</div><div class="service-name">卫生间</div></div>
                    <div class="service-item" onclick="alert('电梯位置')"><div class="service-icon">🛗</div><div class="service-name">电梯</div></div>
                    <div class="service-item" onclick="alert('客服中心')"><div class="service-icon">💁</div><div class="service-name">客服中心</div></div>
                    <div class="service-item" onclick="alert('ATM位置')"><div class="service-icon">🏧</div><div class="service-name">ATM</div></div>
                    <div class="service-item" onclick="alert('母婴室位置')"><div class="service-icon">🍼</div><div class="service-name">母婴室</div></div>
                    <div class="service-item" onclick="alert('充电站位置')"><div class="service-icon">🔋</div><div class="service-name">充电站</div></div>
                    <div class="service-item" onclick="alert('停车场入口')"><div class="service-icon">🅿️</div><div class="service-name">停车场</div></div>
                    <div class="service-item" onclick="alert('失物招领')"><div class="service-icon">🔍</div><div class="service-name">失物招领</div></div>
                </div>
            </div>
        </div>
    </div>
        </div>
        <div class="home-indicator"></div>
    </div>
    <script>
        function switchFloor(el, floor) {
            document.querySelectorAll('.floor-tabs .floor-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            console.log('[门店导览] 切换楼层:', floor);
            // 模拟楼层切换动画
            const items = document.querySelectorAll('.store-item, .floor-info');
            items.forEach(item => { item.style.animation = 'none'; item.offsetHeight; item.style.animation = 'slideIn .4s ease'; });
        }
        console.log('[门店导览] 页面加载完成');
    </script>
</body>
</html>
