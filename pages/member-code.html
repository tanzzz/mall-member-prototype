<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会员码</title>
    <style>
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; background:#1a1a2e; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        /* iPhone 17 Pro 外壳 */
        .iphone-device { width:403px; height:874px; background:linear-gradient(145deg,#2a2a2a,#1a1a1a,#0d0d0d); border-radius:52px; padding:14px; position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5),0 0 120px rgba(0,0,0,.3),inset 0 0 1px rgba(255,255,255,.1); }
        .iphone-device::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:130px; height:34px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
        .iphone-device::after { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:100px; height:28px; background:#000; border-radius:0 0 16px 16px; z-index:101; }
        .dynamic-island-cam { position:absolute; top:18px; right:calc(50% - 42px); width:10px; height:10px; background:radial-gradient(circle at 35% 35%,#1a1a2e,#000); border-radius:50%; z-index:102; border:1px solid rgba(255,255,255,.05); }
        .btn-side-left-1 { position:absolute; left:-2px; top:140px; width:3px; height:28px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-2 { position:absolute; left:-2px; top:195px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-left-3 { position:absolute; left:-2px; top:253px; width:3px; height:48px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:2px 0 0 2px; }
        .btn-side-right { position:absolute; right:-2px; top:200px; width:3px; height:60px; background:linear-gradient(180deg,#3a3a3a,#2a2a2a); border-radius:0 2px 2px 0; }
        .iphone-screen { width:375px; height:812px; border-radius:40px; overflow:hidden; position:relative; background:#F5F5F5; }
        .home-indicator { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,.2); border-radius:3px; z-index:200; }
        .phone-frame { width:375px; height:812px; background:#F5F5F5; position:relative; overflow:hidden; display:flex; flex-direction:column; }
        .status-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:12px; color:#fff; }
        .status-bar .time { font-weight:600; }
        .status-bar .icons { display:flex; gap:4px; font-size:11px; }
        .nav-bar { height:44px; background:#E2231A; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
        .nav-bar .back { font-size:20px; color:#fff; cursor:pointer; }
        .nav-bar .title { font-size:17px; font-weight:600; color:#fff; }
        .nav-bar .placeholder { width:20px; }
        .scroll-content { flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .scroll-content::-webkit-scrollbar { display:none; }
        .member-badge { text-align:center; margin-bottom:20px; animation:fadeInUp .5s ease; }
        .member-badge .avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#FFD700,#FFA000); display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; font-weight:700; margin:0 auto 10px; border:3px solid rgba(226,35,26,.2); }
        .member-badge .name { font-size:18px; font-weight:600; color:#333; }
        .member-badge .level { display:inline-block; background:linear-gradient(135deg,#FFD700,#FFA000); padding:2px 10px; border-radius:10px; font-size:11px; font-weight:600; color:#8B4513; margin-top:6px; }
        .qr-card { background:#fff; border-radius:16px; padding:24px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.08); animation:fadeInUp .5s ease .2s both; width:100%; }
        .qr-card .qr-title { font-size:13px; color:#999; margin-bottom:16px; }
        .qr-area { width:180px; height:180px; margin:0 auto 16px; background:#F5F5F5; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; animation:pulse 2s ease-in-out infinite; }
        .qr-area .qr-placeholder { font-size:14px; color:#C0C0C0; text-align:center; line-height:1.6; }
        .qr-area .qr-placeholder .icon { font-size:48px; display:block; margin-bottom:4px; }
        .qr-area::after { content:''; position:absolute; inset:4px; border:2px dashed #E0E0E0; border-radius:6px; }
        .qr-card .code-num { font-size:16px; font-weight:600; color:#333; letter-spacing:2px; margin-bottom:4px; }
        .qr-card .code-tip { font-size:11px; color:#999; }
        .barcode-area { margin-top:16px; padding-top:16px; border-top:.5px solid #F0F0F0; }
        .barcode-area .barcode { height:40px; background:repeating-linear-gradient(90deg,#333 0px,#333 2px,transparent 2px,transparent 4px,#333 4px,#333 5px,transparent 5px,transparent 8px,#333 8px,#333 9px,transparent 9px,transparent 12px); margin-bottom:6px; border-radius:2px; }
        .barcode-area .barcode-num { font-size:11px; color:#999; letter-spacing:1px; }
        .action-row { display:flex; gap:12px; margin-top:20px; width:100%; animation:fadeInUp .5s ease .4s both; }
        .action-btn { flex:1; height:44px; border-radius:10px; border:none; font-size:14px; font-weight:500; cursor:pointer; transition:transform .2s; display:flex; align-items:center; justify-content:center; gap:6px; }
        .action-btn:active { transform:scale(.97); }
        .action-btn.primary { background:linear-gradient(135deg,#E2231A,#FF4D3A); color:#fff; box-shadow:0 4px 12px rgba(226,35,26,.25); }
        .action-btn.secondary { background:#fff; color:#E2231A; border:1px solid #E2231A; }
        .tip-section { margin-top:24px; text-align:center; animation:fadeInUp .5s ease .5s both; }
        .tip-section .tip { font-size:12px; color:#999; line-height:1.8; }
        .tip-section .tip span { color:#E2231A; }
    </style>
</head>
<body>
    <div class="iphone-device">
        <div class="dynamic-island-cam"></div>
        <div class="btn-side-left-1"></div>
        <div class="btn-side-left-2"></div>
        <div class="btn-side-left-3"></div>
        <div class="btn-side-right"></div>
        <div class="iphone-screen">
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">09:41</span>
            <span class="icons">5G 100% ▮</span>
        </div>
        <div class="nav-bar">
            <span class="back" onclick="history.back()">‹</span>
            <span class="title">会员码</span>
            <span class="placeholder"></span>
        </div>
        <div class="scroll-content">
            <div class="member-badge">
                <div class="avatar">悦</div>
                <div class="name">张小悦</div>
                <div class="level">黄金会员</div>
            </div>
            <div class="qr-card">
                <div class="qr-title">出示会员码享专属优惠</div>
                <div class="qr-area">
                    <div class="qr-placeholder"><span class="icon">📱</span>会员二维码</div>
                </div>
                <div class="code-num">YX 2026 0806 001</div>
                <div class="code-tip">每30秒自动刷新</div>
                <div class="barcode-area">
                    <div class="barcode"></div>
                    <div class="barcode-num">6901234567890</div>
                </div>
            </div>
            <div class="action-row">
                <button class="action-btn primary" onclick="alert('刷新会员码')">🔄 刷新</button>
                <button class="action-btn secondary" onclick="alert('保存到相册')">💾 保存</button>
            </div>
            <div class="tip-section">
                <div class="tip">会员码可在收银台扫码使用<br>享受 <span>会员专属折扣</span> 和 <span>积分累积</span><br>如遇问题请咨询客服 400-888-0000</div>
            </div>
        </div>
    </div>
        </div>
        <div class="home-indicator"></div>
        </div>
</body>
</html>
